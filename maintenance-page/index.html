<!doctype html>
<!--
  Remixer — Maintenance page
  Built from Figma: AI Website Builder → node 27883:21134 ("Maintenance")

  SERVING NOTES (server config, not markup):
  1. Return HTTP 503 Service Unavailable with `Retry-After: 3600` and
     `Cache-Control: no-store`. A 200 tells Google this is the real page.
  2. Do NOT add <meta name="robots" content="noindex">. With a 503, Google
     keeps the URLs and retries; a noindex crawled repeatedly can drop them.
  3. Host this on infrastructure independent of the app (static bucket / CDN
     edge), or it goes down together with what it is meant to cover.
  4. Zero external requests by design: both logos are inline SVG, the grid is
     CSS, no font CDN. Keep it that way.
  5. Fonts: the design uses Gilroy SemiBold (display) and Proxima Nova (text).
     Both are licensed, so they are not embedded here — the stack picks them up
     when installed locally. For production, self-host the licensed woff2 files
     and fill in the @font-face blocks below (base64-inline them to keep rule 4).

  MOTION:
  - Logo = the SVGator export (Remixer logo (Dark).svg) inlined as-is. Its own
    settings already do what we want: start on load, 1 iteration, 1620ms, holds
    the last frame. Do not "fix" it in JS.
  - The oversized "Maintenance" comes up out of the dark on opacity alone over
    ~3s — no wipe, no blur, no glow. The 1px contour surfaces first, the fill
    follows, and one slow pass of light runs along the CONTOUR only, never the
    letter body. Everything is one-shot; nothing loops.
  - The grid opens as an aperture spreading outward from under the logo (its
    radial mask grows; the lines never change brightness), so it shares one
    origin with the logo instead of being a third separate effect.
  - The headline uses the fit-care hero reveal: one .ln mask per line, the inner
    <i> rides up from translateY(105%) over 1.15s on cubic-bezier(.16,1,.3,1),
    lines staggered. The sentence and the button then rise 16px into place.
  - No JS and reduced-motion both fall back to the static logo + final state.
-->

<style>
  /* Licensed display/text faces — used when installed locally.
     For production, point these at self-hosted (ideally base64-inlined) woff2. */
  @font-face {
    font-family: "GilroyWeb";
    font-weight: 600;
    font-style: normal;
    font-display: swap;
    src: url("fonts/gilroy-semibold.woff2") format("woff2");
  }
  @font-face {
    font-family: "ProximaNovaWeb";
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src: url("fonts/proximanova-regular.woff2") format("woff2");
  }
  @font-face {
    font-family: "ProximaNovaWeb";
    font-weight: 600;
    font-style: normal;
    font-display: swap;
    src: url("fonts/proximanova-semibold.woff2") format("woff2");
  }

  :root {
    /* Single, deliberate dark palette — Remixer builder surface */
    --bg: #141417;
    --ink: #ffffff;
    --ink-muted: rgba(255, 255, 255, 0.56);
    --rule: rgba(255, 255, 255, 0.08);
    --btn-bg: #fafafa;
    --btn-ink: #09090b;

    --font-display: "Gilroy", "GilroyWeb", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-text: "Proxima Nova", "ProximaNovaWeb", system-ui, -apple-system, "Segoe UI", sans-serif;

    --fs-h1: clamp(34px, 4.6vw, 80px);
    --fs-ghost: min(400px, 15.6vw);

    /* Vertical rhythm from the design (84 / 56), compressed on short windows */
    --gap-logo: clamp(48px, 7.2vh, 84px);
    --gap-action: clamp(32px, 4.8vh, 56px);

    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    /* same easing as the fit-care hero, where this line reveal comes from */
    --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
    /* Material 3 emphasized decelerate — used for the button states */
    --ease-m3: cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    overflow-x: clip;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 32px 24px calc(32px + 5vh);
    isolation: isolate;
  }

  /* 96px rule grid, fading out toward the bottom of the viewport.
     Two mask layers, intersected: an aperture centred on the logo (this is the
     one that animates on load) and the design's bottom fade (static). At rest
     the aperture is larger than the viewport, so only the bottom fade shows. */
  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, var(--rule) 1px, transparent 1px),
      linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
    background-size: 96px 96px;
    -webkit-mask-image:
      radial-gradient(ellipse at center, #000 0 42%, rgb(0 0 0 / 0) 72%),
      linear-gradient(to bottom,
        rgb(0 0 0 / 1) 0%, rgb(0 0 0 / 1) 21%, rgb(0 0 0 / 0.63) 51%,
        rgb(0 0 0 / 0.38) 70%, rgb(0 0 0 / 0.16) 88%, rgb(0 0 0 / 0) 100%);
    mask-image:
      radial-gradient(ellipse at center, #000 0 42%, rgb(0 0 0 / 0) 72%),
      linear-gradient(to bottom,
        rgb(0 0 0 / 1) 0%, rgb(0 0 0 / 1) 21%, rgb(0 0 0 / 0.63) 51%,
        rgb(0 0 0 / 0.38) 70%, rgb(0 0 0 / 0.16) 88%, rgb(0 0 0 / 0) 100%);
    -webkit-mask-size: 400% 280%, 100% 100%;
    mask-size: 400% 280%, 100% 100%;
    -webkit-mask-position: 50% 36%, 0 0;
    mask-position: 50% 36%, 0 0;
    -webkit-mask-repeat: no-repeat, no-repeat;
    mask-repeat: no-repeat, no-repeat;
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }

  .stack {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--gap-action);
    width: 100%;
    max-width: 960px;
    text-align: center;
  }

  .head {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--gap-logo);
    width: 100%;
  }

  .logo-slot {
    width: 120px;
    height: 120px;
    flex: none;
  }

  .logo {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Animated logo needs its player; static one covers no-JS and reduced motion */
  .logo-anim { display: none; }
  .js .logo-anim { display: block; }
  .js .logo-static { display: none; }

  .copy {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
  }

  .headline {
    position: relative;
    margin: 0;
  }

  /* ---- Oversized wordmark behind the headline -------------------------------
     Figma: Gilroy SemiBold 400, fill = linear gradient white .12 → 0 (running
     downward, reaching 0 at 81.8% of the text box), plus a 1px INSIDE stroke =
     linear gradient white .08 → 0 (constant until 41.4%, gone by 78.6%).
     Reproduced as two stacked layers: the fill layer paints the gradient
     through background-clip:text; the edge layer paints ONLY the stroke
     (transparent text fill) and uses a mask for the stroke's own fade.
     Its optical centre sits on the headline's first line, as in the design. */
  .ghost {
    position: absolute;
    left: 50%;
    top: calc(var(--fs-h1) * 0.594);
    transform: translate(-50%, -50%);
    z-index: 0;
    display: grid;
    pointer-events: none;
    user-select: none;
  }

  .ghost > span {
    grid-area: 1 / 1;
    display: block;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--fs-ghost);
    line-height: 1.1925;
    white-space: nowrap;
  }

  .ghost-fill {
    background-image: linear-gradient(180deg,
      rgb(255 255 255 / 0.12) -31.32%,
      rgb(255 255 255 / 0) 81.82%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  .ghost-edge {
    color: transparent;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1px rgb(255 255 255 / 0.08);
    -webkit-mask-image: linear-gradient(180deg, #000 41.4%, transparent 78.62%);
    mask-image: linear-gradient(180deg, #000 41.4%, transparent 78.62%);
  }

  /* Slow sheen — contour only, never the letter body.
     No blur, no glow anywhere on this word: the reveal is opacity alone. */
  .ghost-glint {
    color: transparent;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1px rgb(255 255 255 / 0.22);
    opacity: 0;
  }

  h1 {
    position: relative;
    z-index: 1;
    margin: 0 auto;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--fs-h1);
    line-height: 1.1875;
    letter-spacing: -0.005em;
    color: var(--ink);
  }

  /* Per-line mask: each line rides up from behind its own edge. The padding +
     matching negative margin keeps ascenders and descenders out of the clip
     while leaving the metrics untouched. */
  .ln {
    display: block;
    overflow: hidden;
    padding: 0.14em 0.05em 0.08em;
    margin: -0.14em -0.05em -0.08em;
  }

  .ln > i {
    display: block;
    font-style: normal;
  }

  .sub {
    margin: 0;
    font-size: 18px;
    line-height: 1.4;
    color: var(--ink-muted);
  }

  /* Rest = the solid light button from the design. Hover turns it to glass —
     values read off the Figma hover variant (node 27887:22488): fill white 12%,
     background blur 32 (= backdrop-filter: blur(16px)), label white, and a 1px
     gradient stroke white .32 → .08 → .24. Nothing moves: no shape change, no
     scale. It eases in over 240ms and back out over 320ms, so leaving the
     button feels as soft as entering it. */
  .refresh {
    position: relative;
    /* one step up from the kit's Size=Large (48/24/15) — the standard next
       rung, kept proportional: height, padding and label all move together */
    height: 56px;
    padding: 0 32px;
    border: 0;
    /* fully rounded — the kit's Shape=Rounded token */
    border-radius: 999px;
    background-color: var(--btn-bg);
    color: var(--btn-ink);
    -webkit-backdrop-filter: blur(0px);
    backdrop-filter: blur(0px);
    font-family: var(--font-text);
    font-weight: 600;
    font-size: 16px;
    line-height: 20px;
    cursor: pointer;
    transition:
      background-color 0.32s var(--ease-m3),
      color 0.32s var(--ease-m3),
      -webkit-backdrop-filter 0.32s var(--ease-m3),
      backdrop-filter 0.32s var(--ease-m3);
  }

  /* The gradient stroke, drawn as a 1px ring so it can cross-fade. A gradient
     cannot live in border-color, hence the two-mask cut-out. */
  .refresh::after {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: linear-gradient(92.5deg,
      rgb(255 255 255 / 0.32) 0%,
      rgb(255 255 255 / 0.08) 50.5%,
      rgb(255 255 255 / 0.24) 100%);
    -webkit-mask-image: linear-gradient(#000, #000), linear-gradient(#000, #000);
    mask-image: linear-gradient(#000, #000), linear-gradient(#000, #000);
    -webkit-mask-clip: content-box, border-box;
    mask-clip: content-box, border-box;
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.32s var(--ease-m3);
  }

  @media (hover: hover) {
    .refresh:hover {
      /* Figma's hover fill is white 12% (lands at ~#303033 over the page) —
         too big a drop from the solid button; 32% was light enough that the
         white label washed out at 6.4:1. 20% sits between them: still clearly
         lighter than the Figma value, and the label reads at 9.9:1. */
      background-color: rgb(255 255 255 / 0.2);
      color: #ffffff;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      transition-duration: 0.24s;
    }
    .refresh:hover::after { opacity: 1; transition-duration: 0.24s; }
  }

  /* Press goes a step further from rest — i.e. slightly darker than hover,
     which on a dark ground reads as the button being pushed in. */
  .refresh:active {
    background-color: rgb(255 255 255 / 0.14);
    color: #ffffff;
    transition-duration: 0.09s;
  }
  .refresh:active::after { opacity: 1; transition-duration: 0.09s; }

  .refresh:focus-visible {
    outline: 2px solid rgb(255 255 255 / 0.6);
    outline-offset: 3px;
  }

  /* ---- One-shot entrance --------------------------------------------------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes lineUp {
    from { transform: translateY(105%); }
    to   { transform: none; }
  }

  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* The grid opens outward from under the logo — the aperture grows, the lines
     themselves never brighten, so there is nothing for the eye to catch. */
  @keyframes gridBloom {
    0%   { opacity: 0; -webkit-mask-size: 0% 0%, 100% 100%; mask-size: 0% 0%, 100% 100%; }
    40%  { opacity: 1; }
    100% { opacity: 1; -webkit-mask-size: 400% 280%, 100% 100%; mask-size: 400% 280%, 100% 100%; }
  }

  /* One slow pass of light along the contour, in and out */
  @keyframes glint {
    0%   { -webkit-mask-position: 100% 0, 0 0; mask-position: 100% 0, 0 0; opacity: 0; }
    22%  { opacity: 1; }
    68%  { opacity: 1; }
    100% { -webkit-mask-position: -32% 0, 0 0; mask-position: -32% 0, 0 0; opacity: 0; }
  }

  .js .grid { animation: gridBloom 2.8s cubic-bezier(0.25, 0.6, 0.2, 1) 0.1s both; }

  /* The word comes up out of the dark on opacity alone — no wipe, no cut, no
     blur, no glow. The contour surfaces first, the mass fills in behind it. */
  .js .ghost-edge { animation: fade 2.9s cubic-bezier(0.33, 0.05, 0.2, 1) 0.35s both; }
  .js .ghost-fill { animation: fade 3.4s cubic-bezier(0.33, 0.05, 0.2, 1) 0.8s both; }

  .js .ghost-glint {
    -webkit-mask-image:
      linear-gradient(96deg, transparent 0 16%, rgb(0 0 0 / 0.95) 40%, rgb(0 0 0 / 0.95) 52%, transparent 76%),
      linear-gradient(180deg, #000 41.4%, transparent 78.62%);
    mask-image:
      linear-gradient(96deg, transparent 0 16%, rgb(0 0 0 / 0.95) 40%, rgb(0 0 0 / 0.95) 52%, transparent 76%),
      linear-gradient(180deg, #000 41.4%, transparent 78.62%);
    -webkit-mask-size: 260% 100%, 100% 100%;
    mask-size: 260% 100%, 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
    animation: glint 3.6s cubic-bezier(0.45, 0.05, 0.35, 1) 1.5s both;
  }

  /* Headline: line by line out from behind the mask. Then the sentence and the
     button simply rise into place, in that order. */
  .js .logo-slot            { animation: fade 0.8s var(--ease-expo) 0.05s both; }
  .js .ln:nth-child(1) > i  { animation: lineUp 1.15s var(--ease-expo) 0.15s both; }
  .js .ln:nth-child(2) > i  { animation: lineUp 1.15s var(--ease-expo) 0.27s both; }
  .js .sub                  { animation: rise 0.9s var(--ease-expo) 0.55s both; }
  .js .refresh              { animation: rise 0.9s var(--ease-expo) 0.72s both; }

  @media (max-width: 720px) {
    .logo-slot { width: 88px; height: 88px; }
    .copy { gap: 16px; }
    .sub { font-size: 16px; }
    .line-break { display: none; }
  }

  /* Below this width the oversized wordmark is no longer several times the
     size of the headline, so it stops reading as a backdrop and starts
     colliding with it. Drop it rather than shrink it. */
  @media (max-width: 560px) {
    .ghost { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .js .logo-anim { display: none; }
    .js .logo-static { display: block; }
    /* the state layer stays — it is feedback, not motion */
    .refresh::before { transition: none; }
    .js .grid,
    .js .logo-slot,
    .js .ln > i,
    .js .sub,
    .js .refresh,
    .js .ghost-fill,
    .js .ghost-edge { animation: none; transform: none; opacity: 1; }
    .js .ghost-glint { animation: none; display: none; }
    .js .ghost-fill,
    .js .ghost-edge { opacity: 1; }
  }
</style>
</head>
